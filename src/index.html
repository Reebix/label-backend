<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Label Printer</title>
</head>
<body>
<div style="justify-content: center; display: flex; flex-direction: column; align-items: center;">
    <img alt="preview" id="prev" src="/last" width="20%"/>
    <div style="justify-content: center; display: flex; flex-direction: column; align-items: center;">
        <label for="labelText">Label Text:</label>
        <input id="labelText" name="labelText" required type="text">
        <label for="labelQrText">QR Code Text:</label>
        <input id="labelQrText" name="labelQrText" required type="text">
        <label for="flipped">Flipped:</label>
        <input id="flipped" name="flipped" required type="checkbox">
        <button id="submit" type="submit">Print Label</button>
        <button id="preview">Preview</button>
    </div>
</div>
</body>


<script>

    document.addEventListener('DOMContentLoaded', () => {
        const labelText = localStorage.getItem('labelText');
        const labelQrText = localStorage.getItem('labelQrText');
        const flipped = localStorage.getItem('flipped');

        if (labelText) {
            document.getElementById('labelText').value = labelText;
        }

        if (labelQrText) {
            document.getElementById('labelQrText').value = labelQrText;
        }

        if (flipped) {
            document.getElementById('flipped').checked = flipped === 'true';
        }
    });

    const prev = document.getElementById('prev');
    prev.src = "/last?" + new Date().getTime();

    const submit = document.getElementById('submit');
    const preview = document.getElementById('preview');


    submit.addEventListener('click', (event) => {
        event.preventDefault();
        request('/label');
    });

    preview.addEventListener('click', (event) => {
        event.preventDefault();
        request('/preview');
    });

    function request(endpoint) {
        const labelText = document.getElementById('labelText').value;
        const labelQrText = document.getElementById('labelQrText').value;
        const flipped = document.getElementById('flipped').checked;

        localStorage.setItem('labelText', labelText);
        localStorage.setItem('labelQrText', labelQrText);
        localStorage.setItem('flipped', flipped);

        let body = {
            name: labelText,
            qr: labelQrText,
            flipped: flipped
        }

        fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        }).then(response => {
            if (response.ok) {
                window.location.reload();
            } else {
                alert('Failed to print label.');
            }
        }).catch(error => {
            console.error('Error:', error);
            alert('An error occurred while printing the label.');
        });

    }


</script>
</html>
